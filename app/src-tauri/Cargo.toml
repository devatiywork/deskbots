[package]
name = "deskbots"
version = "4.1.1"
edition = "2021"
description = "DeskBots: пиксельный офис с ИИ-агентами на рабочем столе"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
office-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
# масштаб WebView2 для монитора обоев (те же версии, что у Tauri)
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
